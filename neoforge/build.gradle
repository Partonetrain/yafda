plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    flatDir {
        //l2core + l2modulerblock goes in here
        dirs 'libs'
    }

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url 'https://maven.wispforest.io' }
    maven {
        url "https://maven.su5ed.dev/releases"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    maven { // Registrate
        url "https://maven.ithundxr.dev/snapshots"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    repositories {
        maven { url 'https://maven.blamejared.com' }
    }
}

dependencies {
    implementation "maven.modrinth:farmers-delight:1.21.1-1.2.6"
    implementation "maven.modrinth:deeperdarker:1.3.4-neoforge+1.21"
    implementation "maven.modrinth:aether:1.21.1-1.5.3-neoforge"
    implementation "io.wispforest:owo-lib-neoforge:0.12.15-beta.12+1.21"
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:0.116.7+2.2.4+1.21.1"
    implementation "curse.maven:thirst-was-taken-679270:5857373"
    implementation 'com.github.glitchfiend:TerraBlender-neoforge:1.21.1-4.1.0.8'
    implementation 'maven.modrinth:deep-aether:1.21.1-1.1.4'
    implementation 'maven.modrinth:brewin-and-chewin:4.2.3+1.21.1-neoforge'
    implementation 'maven.modrinth:geckolib:QEqpUJ1G'
    implementation "top.theillusivec4.curios:curios-neoforge:9.4.2+1.21.1"

    implementation (group: 'dev.xkmc', name: 'l2core', version: "[3.0.8+1,)")
    implementation (group: 'dev.xkmc', name: 'l2modularblocks', version: "[3.0.0+4,)")
    implementation (group: 'dev.xkmc', name: 'l2serial', version: "[3.0.9+5,)")

    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.2.1298")
    implementation 'maven.modrinth:arsdelight:2.1.9'
    implementation ("com.alexthw.ars_elemental:ars_elemental-1.21.1:0.7.8.4.145") {transitive=false}
    compileOnly (group: 'com.tterrag.registrate', name: 'Registrate', version: "[MC1.21-1.3.0+55,)") //for arsdelight

    implementation 'maven.modrinth:immersiveengineering:12.2.0-187'
    implementation 'maven.modrinth:malum:1.8.2'
    implementation 'maven.modrinth:lodestonelib:1.8.2'

    compileOnly 'maven.modrinth:divinerpg:1.10.9.3' //for some reason can't get into a world in dev env when this mod is loaded

    //implementation files("libs/millenaire.jar")


}

sourceSets.main.resources { srcDir 'src/generated/resources' }